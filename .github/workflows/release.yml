name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./... -v -count=1

      - name: Build release binaries
        run: make release

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/autodns-linux-amd64
            dist/autodns-linux-arm64
            dist/autodns-darwin-amd64
            dist/autodns-darwin-arm64
            dist/autodns-windows-amd64.exe
            dist/SHA256SUMS
